server:
  port: 1010

services:
  order: { url: http://localhost:8081 }
  stock: { url: http://localhost:8082 }
  payment: { url: http://localhost:8085 }
  bank: { url: http://localhost:8084 }


spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: apigw
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/saga
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8181/realms/saga
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            client-secret: ${KC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${services.order.url}
              predicates:
                - Path=/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: stock-service
              uri: ${services.stock.url}
              predicates:
                - Path=/api/stocks/**,/api/products,/api/products/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: ${services.payment.url}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
          default-filters:
            - TokenRelay=

management:
  endpoint:
    health:
      probes:
        enabled: true