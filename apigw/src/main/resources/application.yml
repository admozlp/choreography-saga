server:
  port: 1010


eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}:${random.int}


spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: apigw
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/saga
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8181/realms/saga
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            client-secret: ${KC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile,email

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: stock-service
              uri: lb://stock-service
              predicates:
                - Path=/api/stocks/**,/api/products,/api/products/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
          default-filters:
            - TokenRelay=