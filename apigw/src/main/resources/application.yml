spring:
  application:
    name: apigw
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway
            authorization-grant-type: authorization_code
            scope: openid,profile,email
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${services.order.url}
              predicates:
                - Path=/api/orders/**,/api/orders
              filters:
                - StripPrefix=1
            - id: stock-service
              uri: ${services.stock.url}
              predicates:
                - Path=/api/stocks/**,/api/products,/api/products/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: ${services.payment.url}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
          default-filters:
            - TokenRelay=

management:
  endpoint:
    health:
      probes:
        enabled: true