- hosts: all:localhost   # bütün VM'ler + ana makine
  become: true
  tasks:
    - name: harbor.internal tools VM'in IP'sini göstersin
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\sharbor\.internal$'   # satır varsa güncelle, yoksa ekle
        line: "{{ hostvars['tools-vm'].ansible_host }} harbor.internal"